<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | CampusMind AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="../css/auth.css">

</head>

<body>

    <div class="auth-page">

        <div class="auth-glow glow-one"></div>
        <div class="auth-glow glow-two"></div>

        <a href="../index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>

        <div class="auth-container">

            <div class="auth-brand">

                <div class="brand-icon">
                    <i class="fa-solid fa-brain"></i>
                </div>

                <span>
                    CampusMind
                    <b>AI</b>
                </span>

            </div>


            <div class="auth-card">

                <div class="auth-icon">
                    <i class="fa-solid fa-right-to-bracket"></i>
                </div>

                <h1>Welcome back</h1>

                <p class="auth-subtitle">
                    Sign in to continue your CampusMind journey.
                </p>


                <form id="signinForm">

                    <div class="form-group">

                        <label for="signinEmail">
                            Email Address
                        </label>

                        <div class="input-box">

                            <i class="fa-regular fa-envelope"></i>

                            <input
                                type="email"
                                id="signinEmail"
                                placeholder="you@example.com"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <div class="label-row">

                            <label for="signinPassword">
                                Password
                            </label>

                            <a href="#" id="forgotPassword">
                                Forgot password?
                            </a>

                        </div>


                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="signinPassword"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="signinPassword">

                                <i class="fa-regular fa-eye"></i>

                            </button>

                        </div>

                    </div>


                    <label class="terms remember">

                        <input type="checkbox">

                        <span>
                            Remember me
                        </span>

                    </label>


                    <button
                        type="submit"
                        class="auth-button">

                        Sign In

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>


                    <div
                        id="signinMessage"
                        class="form-message">
                    </div>

                </form>


                <div class="auth-divider">
                    <span>New to CampusMind?</span>
                </div>


                <a href="signup.html" class="switch-auth">
                    Create an Account
                </a>

            </div>


            <p class="auth-footer">
                © 2026 CampusMind AI • Built for smarter learning
            </p>

        </div>

    </div>


    <script src="../js/auth.js"></script>

</body>
</html>
