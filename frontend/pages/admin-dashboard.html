<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMind AI — Admin Command Center</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Main & Dashboard Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">

    <!-- React 18 & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-brain"></i>
            </div>
            <span>CampusMind <span class="ai-text">AI</span></span>
        </div>
        <nav>
            <a href="../index.html">Home</a>
            <a href="admin-dashboard.html" class="active">Admin Portal</a>
            <a href="student-dashboard.html">Student View</a>
            <a href="chat.html">AI Chat</a>
            <a href="features.html">Features</a>
        </nav>
        <div class="auth-buttons">
            <a href="../auth/signin.html" class="signin-button">Sign In</a>
        </div>
    </header>

    <!-- REACT ROOT -->
    <div id="admin-dashboard-root">
        <div style="text-align:center;padding:140px 20px;color:#00d4ff;">
            <i class="fa-solid fa-circle-notch fa-spin" style="font-size:32px;"></i>
            <p style="margin-top:16px;font-size:16px;">Loading Admin Command Center…</p>
        </div>
    </div>

    <!-- REACT SCRIPT -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_BASE = (function () {
            if (window.CAMPUSMIND_API_BASE) return window.CAMPUSMIND_API_BASE;
            try {
                if (window.location && window.location.protocol && window.location.protocol.startsWith("http")) {
                    const port = window.location.port;
                    if (!port || port === "80" || port === "443" || port === "5000") {
                        return window.location.origin;
                    }
                    if (window.location.hostname) {
                        return window.location.protocol + "//" + window.location.hostname + ":5000";
                    }
                }
            } catch (e) {}
            return "http://127.0.0.1:5000";
        })();

        function AdminDashboardApp() {
            const [activeTab, setActiveTab] = useState("documents"); // documents, notices, events, users
            const [documents, setDocuments] = useState([]);
            const [notices, setNotices] = useState([]);
            const [users, setUsers] = useState([]);
            const [events, setEvents] = useState([]);
            const [loading, setLoading] = useState(false);
            const [msg, setMsg] = useState({ text: "", type: "" });

            // Upload Form State
            const [uploadFile, setUploadFile] = useState(null);
            const [docTitle, setDocTitle] = useState("");
            const [docCategory, setDocCategory] = useState("syllabus");
            const [docDept, setDocDept] = useState("Computer Science");
            const [docYear, setDocYear] = useState("All");
            const [isUploading, setIsUploading] = useState(false);

            // Notice Form State
            const [noticeTitle, setNoticeTitle] = useState("");
            const [noticeContent, setNoticeContent] = useState("");
            const [noticeCategory, setNoticeCategory] = useState("Academic");
            const [noticeDept, setNoticeDept] = useState("All");
            const [noticeYear, setNoticeYear] = useState("All");
            const [noticePriority, setNoticePriority] = useState("Normal");

            // Event Form State
            const [eventTitle, setEventTitle] = useState("");
            const [eventDesc, setEventDesc] = useState("");
            const [eventCategory, setEventCategory] = useState("Hackathon");
            const [eventVenue, setEventVenue] = useState("Main Auditorium");
            const [eventDate, setEventDate] = useState("");

            // Attendance Manager State (HOD & Admin)
            const [attendanceRecords, setAttendanceRecords] = useState([]);
            const [attDeptFilter, setAttDeptFilter] = useState("All");
            const [attYearFilter, setAttYearFilter] = useState("All");
            const [attStatusFilter, setAttStatusFilter] = useState("All");
            const [attUploadFile, setAttUploadFile] = useState(null);
            const [attDept, setAttDept] = useState("BBA(CA)");
            const [attYear, setAttYear] = useState("1st Year");
            const [attSubject, setAttSubject] = useState("Core Curriculum");
            const [attSubjectCode, setAttSubjectCode] = useState("");
            const [attMonth, setAttMonth] = useState("Overall");
            const [attUploadedBy, setAttUploadedBy] = useState("Department HOD");
            const [isUploadingAtt, setIsUploadingAtt] = useState(false);

            // Manual Attendance Form State
            const [manualName, setManualName] = useState("");
            const [manualRoll, setManualRoll] = useState("");
            const [manualId, setManualId] = useState("");
            const [manualEmail, setManualEmail] = useState("");
            const [manualTotal, setManualTotal] = useState("40");
            const [manualAttended, setManualAttended] = useState("35");

            function showToast(text, type = "success") {
                setMsg({ text, type });
                setTimeout(() => setMsg({ text: "", type: "" }), 4000);
            }

            // Fetch Documents
            async function fetchDocuments() {
                try {
                    const res = await fetch(`${API_BASE}/api/admin/documents`);
                    const data = await res.json();
                    if (data.success) setDocuments(data.documents);
                } catch (e) {
                    console.error("Error fetching documents:", e);
                }
            }

            // Fetch Notices
            async function fetchNotices() {
                try {
                    const res = await fetch(`${API_BASE}/api/student/notices`);
                    const data = await res.json();
                    if (data.success) setNotices(data.notices);
                } catch (e) {
                    console.error("Error fetching notices:", e);
                }
            }

            // Fetch Users
            async function fetchUsers() {
                try {
                    const res = await fetch(`${API_BASE}/api/admin/users`);
                    const data = await res.json();
                    if (data.success) setUsers(data.users);
                } catch (e) {
                    console.error("Error fetching users:", e);
                }
            }

            // Fetch Attendance Records
            async function fetchAttendance() {
                try {
                    let url = `${API_BASE}/api/attendance/department?department=${encodeURIComponent(attDeptFilter)}&year=${encodeURIComponent(attYearFilter)}`;
                    if (attStatusFilter !== "All") url += `&status=${encodeURIComponent(attStatusFilter)}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.success) setAttendanceRecords(data.records);
                } catch (e) {
                    console.error("Error fetching attendance:", e);
                }
            }

            useEffect(() => {
                fetchDocuments();
                fetchNotices();
                fetchUsers();
                fetchAttendance();
            }, []);

            useEffect(() => {
                if (activeTab === "attendance") {
                    fetchAttendance();
                }
            }, [activeTab, attDeptFilter, attYearFilter, attStatusFilter]);

            // Handle Attendance Sheet Upload by HOD
            async function handleAttendanceUpload(e) {
                e.preventDefault();
                if (!attUploadFile) {
                    showToast("Please choose an attendance sheet (CSV / Excel / TXT).", "error");
                    return;
                }

                setIsUploadingAtt(true);
                const formData = new FormData();
                formData.append("file", attUploadFile);
                formData.append("department", attDept);
                formData.append("year_of_study", attYear);
                formData.append("subject_name", attSubject);
                formData.append("subject_code", attSubjectCode);
                formData.append("month", attMonth);
                formData.append("uploaded_by", attUploadedBy);

                try {
                    const res = await fetch(`${API_BASE}/api/attendance/upload`, {
                        method: "POST",
                        body: formData
                    });
                    const data = await res.json();
                    if (data.success) {
                        showToast(data.message, "success");
                        setAttUploadFile(null);
                        const fileInput = document.getElementById("att-file-picker");
                        if (fileInput) fileInput.value = "";
                        fetchAttendance();
                    } else {
                        showToast(data.error || "Failed to process attendance sheet.", "error");
                    }
                } catch (err) {
                    showToast("Error uploading attendance sheet: " + err.message, "error");
                } finally {
                    setIsUploadingAtt(false);
                }
            }

            // Handle Manual Attendance Submit by HOD
            async function handleManualAttendanceSubmit(e) {
                e.preventDefault();
                if (!manualName) {
                    showToast("Please enter the student's name.", "error");
                    return;
                }

                try {
                    const res = await fetch(`${API_BASE}/api/attendance/record`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            student_name: manualName,
                            roll_no: manualRoll,
                            student_id: manualId,
                            email: manualEmail,
                            department: attDept,
                            year_of_study: attYear,
                            subject_name: attSubject,
                            subject_code: attSubjectCode,
                            month: attMonth,
                            total_lectures: parseInt(manualTotal) || 0,
                            attended_lectures: parseInt(manualAttended) || 0,
                            uploaded_by: attUploadedBy
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        showToast(data.message, "success");
                        setManualName("");
                        setManualRoll("");
                        setManualId("");
                        setManualEmail("");
                        fetchAttendance();
                    } else {
                        showToast(data.error || "Failed to save attendance record.", "error");
                    }
                } catch (err) {
                    showToast("Error recording attendance: " + err.message, "error");
                }
            }

            // Delete Attendance Record
            async function handleDeleteAttendance(recId) {
                if (!confirm("Are you sure you want to remove this attendance record?")) return;
                try {
                    const res = await fetch(`${API_BASE}/api/attendance/${recId}`, { method: "DELETE" });
                    const data = await res.json();
                    if (data.success) {
                        showToast("Attendance record removed.", "success");
                        fetchAttendance();
                    }
                } catch (err) {
                    showToast("Error deleting record: " + err.message, "error");
                }
            }

            // Handle Document Upload
            async function handleDocUpload(e) {
                e.preventDefault();
                if (!uploadFile) {
                    showToast("Please choose a PDF or text file.", "error");
                    return;
                }

                setIsUploading(true);
                const formData = new FormData();
                formData.append("file", uploadFile);
                formData.append("title", docTitle || uploadFile.name);
                formData.append("category", docCategory);
                formData.append("department", docDept);
                formData.append("target_year", docYear);

                try {
                    const token = localStorage.getItem("campusmind_jwt");
                    const headers = token ? { "Authorization": `Bearer ${token}` } : {};

                    const res = await fetch(`${API_BASE}/api/admin/documents/upload`, {
                        method: "POST",
                        headers,
                        body: formData
                    });
                    const data = await res.json();

                    if (data.success) {
                        showToast(`Document "${data.document.title}" chunked and indexed into RAG! 🚀`, "success");
                        setUploadFile(null);
                        setDocTitle("");
                        document.getElementById("admin-file-picker").value = "";
                        fetchDocuments();
                    } else {
                        showToast(data.error || "Failed to upload document.", "error");
                    }
                } catch (err) {
                    showToast("Error uploading file to backend.", "error");
                } finally {
                    setIsUploading(false);
                }
            }

            // Handle Delete Document
            async function handleDeleteDoc(id) {
                if (!confirm("Are you sure you want to remove this document and its embeddings from the RAG store?")) return;
                try {
                    const res = await fetch(`${API_BASE}/api/admin/documents/${id}`, { method: "DELETE" });
                    const data = await res.json();
                    if (data.success) {
                        showToast("Document deleted.", "success");
                        fetchDocuments();
                    }
                } catch (e) {
                    showToast("Error deleting document.", "error");
                }
            }

            // Handle Create Notice
            async function handleCreateNotice(e) {
                e.preventDefault();
                if (!noticeTitle.trim() || !noticeContent.trim()) {
                    showToast("Title and content are required.", "error");
                    return;
                }

                try {
                    const res = await fetch(`${API_BASE}/api/admin/notices`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            title: noticeTitle,
                            content: noticeContent,
                            category: noticeCategory,
                            department: noticeDept,
                            target_year: noticeYear,
                            priority: noticePriority
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        showToast("Notice published successfully! 📢", "success");
                        setNoticeTitle("");
                        setNoticeContent("");
                        fetchNotices();
                    }
                } catch (e) {
                    showToast("Error publishing notice.", "error");
                }
            }

            // Handle Delete Notice
            async function handleDeleteNotice(id) {
                if (!confirm("Delete this notice?")) return;
                try {
                    const res = await fetch(`${API_BASE}/api/admin/notices/${id}`, { method: "DELETE" });
                    const data = await res.json();
                    if (data.success) {
                        showToast("Notice deleted.", "success");
                        fetchNotices();
                    }
                } catch (e) {
                    showToast("Error deleting notice.", "error");
                }
            }

            // Handle Create Event
            async function handleCreateEvent(e) {
                e.preventDefault();
                if (!eventTitle.trim() || !eventDesc.trim()) {
                    showToast("Event title and description are required.", "error");
                    return;
                }

                try {
                    const res = await fetch(`${API_BASE}/api/admin/events`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            title: eventTitle,
                            description: eventDesc,
                            category: eventCategory,
                            venue: eventVenue,
                            event_date: eventDate || new Date().toISOString()
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        showToast("Campus event scheduled! 🎪", "success");
                        setEventTitle("");
                        setEventDesc("");
                    }
                } catch (e) {
                    showToast("Error creating event.", "error");
                }
            }

            // Handle Role Change
            async function handleRoleChange(userId, newRole) {
                try {
                    const res = await fetch(`${API_BASE}/api/admin/users/${userId}/role`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ role: newRole })
                    });
                    const data = await res.json();
                    if (data.success) {
                        showToast(`Role updated to '${newRole}'.`, "success");
                        fetchUsers();
                    }
                } catch (e) {
                    showToast("Failed to update role.", "error");
                }
            }

            return (
                <div className="dashboard-page">
                    {/* Header */}
                    <div className="dashboard-header">
                        <div className="dashboard-user-info">
                            <h1>
                                <span>🛡️ Campus Command Center</span>
                                <span className="badge-role badge-admin">Admin Authority</span>
                            </h1>
                            <div className="dashboard-user-meta">
                                <span><i className="fa-solid fa-microchip"></i> RAG Pipeline Active (pgvector + Embeddings)</span>
                                <span><i className="fa-solid fa-file-pdf"></i> {documents.length} Grounded Documents</span>
                                <span><i className="fa-solid fa-users"></i> {users.length} Registered Users</span>
                            </div>
                        </div>

                        <div className="dashboard-actions">
                            <a href="chat.html" className="btn-primary-action">
                                <i className="fa-solid fa-comments"></i> Admin AI Chat
                            </a>
                        </div>
                    </div>

                    {/* Toast Message */}
                    {msg.text && (
                        <div style={{
                            padding: "12px 20px",
                            borderRadius: "10px",
                            marginBottom: "24px",
                            background: msg.type === "error" ? "rgba(239, 68, 68, 0.2)" : "rgba(0, 212, 255, 0.15)",
                            border: `1px solid ${msg.type === "error" ? "rgba(239, 68, 68, 0.4)" : "rgba(0, 212, 255, 0.4)"}`,
                            color: msg.type === "error" ? "#fca5a5" : "#00d4ff",
                            fontWeight: 600
                        }}>
                            {msg.type === "error" ? "⚠️ " : "✓ "} {msg.text}
                        </div>
                    )}

                    {/* Navigation Tabs */}
                    <div style={{ display: "flex", gap: "10px", marginBottom: "28px", flexWrap: "wrap" }}>
                        <button
                            className={activeTab === "documents" ? "btn-primary-action" : "btn-secondary-action"}
                            onClick={() => setActiveTab("documents")}
                        >
                            <i className="fa-solid fa-file-shield"></i> RAG Knowledge Base ({documents.length})
                        </button>
                        <button
                            className={activeTab === "notices" ? "btn-primary-action" : "btn-secondary-action"}
                            onClick={() => setActiveTab("notices")}
                        >
                            <i className="fa-solid fa-bullhorn"></i> Notice Publisher ({notices.length})
                        </button>
                        <button
                            className={activeTab === "events" ? "btn-primary-action" : "btn-secondary-action"}
                            onClick={() => setActiveTab("events")}
                        >
                            <i className="fa-solid fa-calendar-plus"></i> Events & Schedules
                        </button>
                        <button
                            className={activeTab === "users" ? "btn-primary-action" : "btn-secondary-action"}
                            onClick={() => setActiveTab("users")}
                        >
                            <i className="fa-solid fa-users-gear"></i> User Roles ({users.length})
                        </button>
                        <button
                            className={activeTab === "attendance" ? "btn-primary-action" : "btn-secondary-action"}
                            onClick={() => setActiveTab("attendance")}
                        >
                            <i className="fa-solid fa-clipboard-user"></i> HOD Attendance ({attendanceRecords.length})
                        </button>
                    </div>

                    {/* TAB 1: RAG Documents Upload & Store */}
                    {activeTab === "documents" && (
                        <div>
                            {/* Upload Box */}
                            <div className="section-box" style={{ border: "1px solid rgba(0, 212, 255, 0.3)" }}>
                                <div className="section-box-header">
                                    <h2><i className="fa-solid fa-cloud-arrow-up" style={{ color: "#00d4ff" }}></i> Ingest Document into RAG Knowledge Base</h2>
                                    <span className="header-tag">PDF / TXT Auto-Chunk & Embed</span>
                                </div>

                                <form onSubmit={handleDocUpload}>
                                    <div
                                        className="upload-dropzone"
                                        onClick={() => document.getElementById("admin-file-picker").click()}
                                    >
                                        <i className="fa-solid fa-file-pdf upload-icon"></i>
                                        <h3>{uploadFile ? uploadFile.name : "Click to browse or drop Official Campus Document (PDF / TXT)"}</h3>
                                        <p style={{ color: "var(--text-muted)", fontSize: "13px", marginTop: "6px" }}>
                                            Upload syllabus guides, academic regulations, exam rules, timetables, or campus policies.
                                        </p>
                                        <input
                                            type="file"
                                            id="admin-file-picker"
                                            accept=".pdf,.txt,.md"
                                            style={{ display: "none" }}
                                            onChange={(e) => {
                                                if (e.target.files && e.target.files[0]) {
                                                    setUploadFile(e.target.files[0]);
                                                    if (!docTitle) setDocTitle(e.target.files[0].name.replace(/\.[^/.]+$/, ""));
                                                }
                                            }}
                                        />
                                    </div>

                                    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: "16px", marginBottom: "16px" }}>
                                        <div>
                                            <label style={{ fontSize: "12px", color: "var(--text-muted)" }}>Document Title:</label>
                                            <input
                                                type="text"
                                                className="ai-quick-input"
                                                style={{ width: "100%", marginTop: "4px" }}
                                                placeholder="e.g. 2026 Academic Regulations"
                                                value={docTitle}
                                                onChange={(e) => setDocTitle(e.target.value)}
                                            />
                                        </div>
                                        <div>
                                            <label style={{ fontSize: "12px", color: "var(--text-muted)" }}>Category:</label>
                                            <select
                                                className="year-selector"
                                                style={{ width: "100%", marginTop: "4px" }}
                                                value={docCategory}
                                                onChange={(e) => setDocCategory(e.target.value)}
                                            >
                                                <option value="syllabus">Syllabus</option>
                                                <option value="policy">Academic Policy / Rules</option>
                                                <option value="exam">Examination Guideline</option>
                                                <option value="timetable">Timetable / Schedule</option>
                                                <option value="handbook">Hostel / Facility Handbook</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label style={{ fontSize: "12px", color: "var(--text-muted)" }}>Department:</label>
                                            <select
                                                className="year-selector"
                                                style={{ width: "100%", marginTop: "4px" }}
                                                value={docDept}
                                                onChange={(e) => setDocDept(e.target.value)}
                                            >
                                                <option value="All">All Departments</option>
                                                <option value="BBA(CA)">BBA(CA) (3 Years)</option>
                                                <option value="BCS">BCS / B.Sc(CS) (3 Years)</option>
                                                <option value="BBA">BBA (3 Years)</option>
                                                <option value="B.Sc">B.Sc (3 Years)</option>
                                                <option value="B.Com">B.Com (3 Years)</option>
                                                <option value="M.Sc">M.Sc (2 Years PG)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label style={{ fontSize: "12px", color: "var(--text-muted)" }}>Target Year:</label>
                                            <select
                                                className="year-selector"
                                                style={{ width: "100%", marginTop: "4px" }}
                                                value={docYear}
                                                onChange={(e) => setDocYear(e.target.value)}
                                            >
                                                <option value="All">All Years</option>
                                                <option value="1st Year">1st Year (FY)</option>
                                                <option value="2nd Year">2nd Year (SY)</option>
                                                <option value="3rd Year">3rd Year (TY)</option>
                                            </select>
                                        </div>
                                    </div>

                                    <button
                                        type="submit"
                                        className="btn-primary-action"
                                        disabled={isUploading}
                                    >
                                        {isUploading ? (
                                            <>
                                                <i className="fa-solid fa-spinner fa-spin"></i> Processing & Embedding Chunks…
                                            </>
                                        ) : (
                                            <>
                                                <i className="fa-solid fa-microchip"></i> Chunk, Embed & Save to RAG Store
                                            </>
                                        )}
                                    </button>
                                </form>
                            </div>

                            {/* Catalog Table */}
                            <div className="section-box">
                                <div className="section-box-header">
                                    <h2><i className="fa-solid fa-database" style={{ color: "#38bdf8" }}></i> Grounded Documents in Knowledge Base</h2>
                                    <span className="header-tag">{documents.length} Active Documents</span>
                                </div>

                                <div style={{ overflowX: "auto" }}>
                                    <table className="admin-table">
                                        <thead>
                                            <tr>
                                                <th>Doc ID</th>
                                                <th>Document Title</th>
                                                <th>Category</th>
                                                <th>Department</th>
                                                <th>Target Year</th>
                                                <th>Indexed Chunks</th>
                                                <th>Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {documents.map((doc) => (
                                                <tr key={doc.id}>
                                                    <td>#{doc.id}</td>
                                                    <td>
                                                        <strong style={{ color: "#fff" }}>{doc.title}</strong>
                                                        <div style={{ fontSize: "11px", color: "var(--text-muted)" }}>{doc.file_name}</div>
                                                    </td>
                                                    <td>
                                                        <span className="badge-role badge-student" style={{ fontSize: "11px" }}>{doc.category}</span>
                                                    </td>
                                                    <td>{doc.department}</td>
                                                    <td>{doc.target_year}</td>
                                                    <td>
                                                        <span style={{ color: "#00d4ff", fontWeight: 700 }}>{doc.total_chunks} chunks</span>
                                                    </td>
                                                    <td>
                                                        <button
                                                            type="button"
                                                            className="btn-table-delete"
                                                            onClick={() => handleDeleteDoc(doc.id)}
                                                        >
                                                            <i className="fa-solid fa-trash"></i> Delete

                                                                borderRadius: "12px",
                                                                fontWeight: 600,
                                                                background: r.status === 'Good' ? 'rgba(16, 185, 129, 0.15)' : (r.status === 'Average' ? 'rgba(245, 158, 11, 0.15)' : 'rgba(239, 68, 68, 0.15)'),
                                                                color: r.status === 'Good' ? '#10b981' : (r.status === 'Average' ? '#f59e0b' : '#ef4444')
                                                            }}>
                                                                {r.status}
                                                            </span>
                                                        </td>
                                                        <td style={{ fontSize: "11.5px", color: "#94a3b8" }}>{r.uploaded_by}</td>
                                                        <td>
                                                            <button
                                                                className="btn-danger-sm"
                                                                onClick={() => handleDeleteAttendance(r.id)}
                                                                title="Delete attendance entry"
                                                            >
                                                                <i className="fa-solid fa-trash"></i>
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("admin-dashboard-root")).render(<AdminDashboardApp />);
    </script>

    <script src="../js/script.js"></script>
</body>

</html>
